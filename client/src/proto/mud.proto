syntax = "proto3";

package mud;

message InventoryItem {
  string item_id = 1;
  string name = 2;
  int32 quantity = 3;
  bool equipped = 4;
  string description = 5;
  string item_type = 6;
}

message QuestSummary {
  string quest_id = 1;
  string title = 2;
  string status = 3;
  int32 progress = 4;
  int32 target = 5;
  string description = 6;
}

message CultivationState {
  string realm_name = 1;
  int32 realm_stage = 2;
  int64 exp = 3;
  int64 next_breakthrough_exp = 4;
  string primary_skill = 5;
  int32 skill_level = 6;
}

message SectState {
  string sect_id = 1;
  string sect_name = 2;
  string sect_rank = 3;
  bool joined = 4;
}

message TeamMember {
  string account = 1;
  string display_name = 2;
  bool leader = 3;
}

message TeamState {
  string team_id = 1;
  string team_name = 2;
  repeated TeamMember members = 3;
}

message BaseAttributeState {
  int32 spi = 1;
  int32 gin = 2;
  int32 str = 3;
  int32 per = 4;
  int32 int_attr = 5;
  int32 cha = 6;
  int32 luc = 7;
}

message StatusAttributeState {
  int32 kee = 1;
  int32 sen = 2;
  int32 sta = 3;
  int32 mana = 4;
}

message CombatAttributeState {
  int32 phys_hit = 1;
  int32 phys_crit = 2;
  int32 phys_damage = 3;
  int32 phys_haste = 4;
  int32 spell_hit = 5;
  int32 spell_crit = 6;
  int32 spell_damage = 7;
  int32 spell_haste = 8;
  int32 dodge = 9;
  int32 block = 10;
  int32 shield = 11;
  int32 parry = 12;
  int32 armor = 13;
  int32 resist_fire = 14;
  int32 resist_ice = 15;
  int32 resist_thunder = 16;
  int32 resist_wind = 17;
  int32 resist_corrosion = 18;
  int32 resist_poison = 19;
  int32 resist_pierce = 20;
  int32 resist_slash = 21;
  int32 resist_blunt = 22;
}

message RaceState {
  string origin_id = 1;
  string origin_name = 2;
  string race_name = 3;
  string homeland = 4;
  string description = 5;
}

message BackgroundState {
  string background_id = 1;
  string name = 2;
  string description = 3;
  string starter_title = 4;
  string focus_label = 5;
}

message CommandDefinition {
  string command_id = 1;
  string category = 2;
  string label = 3;
  string command = 4;
  string summary = 5;
  string composer_mode = 6;
  string chat_channel = 7;
  bool execute_immediately = 8;
}

message SkillSummary {
  string skill_id = 1;
  string name = 2;
  string category = 3;
  int32 level = 4;
  int64 proficiency = 5;
  string description = 6;
}

message SpellSummary {
  string spell_id = 1;
  string name = 2;
  string element = 3;
  int32 level = 4;
  int64 proficiency = 5;
  int32 mana_cost = 6;
  string description = 7;
  bool unlocked = 8;
}

message RecipeSummary {
  string recipe_id = 1;
  string name = 2;
  bool unlocked = 3;
  int32 level = 4;
  int64 proficiency = 5;
  string description = 6;
}

message ProfessionState {
  int32 alchemy_level = 1;
  int32 exploration_level = 2;
  int32 formation_level = 3;
  int32 forging_level = 4;
}

message CodexSummary {
  string entry_id = 1;
  string category = 2;
  string title = 3;
  string summary = 4;
  bool unlocked = 5;
  bool unread = 6;
  string unlock_source = 7;
}

message CodexEntry {
  string entry_id = 1;
  string category = 2;
  string title = 3;
  string summary = 4;
  string content = 5;
  repeated string related_scene_ids = 6;
  repeated string related_npc_ids = 7;
  repeated string related_monster_ids = 8;
  repeated string related_item_ids = 9;
  repeated string related_sect_ids = 10;
  string unlock_source = 11;
  bool unlocked = 12;
  bool unread = 13;
}

message SceneExit {
  string direction = 1;
  string target_scene_id = 2;
  string target_scene_name = 3;
}

message SceneNpc {
  string npc_id = 1;
  string name = 2;
  bool has_quest = 3;
  string hint = 4;
  string codex_entry_id = 5;
}

message ScenePlayer {
  string account = 1;
  string character_name = 2;
  string title = 3;
  string realm_name = 4;
  string sect_name = 5;
}

message SceneItem {
  string item_id = 1;
  string name = 2;
  string item_type = 3;
  string description = 4;
  string source = 5;
  int32 price = 6;
  string codex_entry_id = 7;
}

message SceneResourceNode {
  string node_id = 1;
  string name = 2;
  string description = 3;
  string drop_item_id = 4;
  string drop_item_name = 5;
  int32 drop_item_count = 6;
  string codex_entry_id = 7;
}

message SceneGroundLoot {
  string loot_id = 1;
  string item_id = 2;
  string item_name = 3;
  int32 quantity = 4;
  string description = 5;
  string codex_entry_id = 6;
  bool lootable = 7;
}

message SceneHazard {
  string hazard_id = 1;
  string name = 2;
  string description = 3;
  int32 hp_cost = 4;
  int32 mana_cost = 5;
  int32 sta_cost = 6;
  string codex_entry_id = 7;
}

message SceneSnapshot {
  string scene_id = 1;
  string scene_name = 2;
  string region_name = 3;
  string description = 4;
  repeated SceneExit exits = 5;
  repeated SceneNpc npcs = 6;
  repeated string monsters = 7;
  repeated string shops = 8;
  repeated ScenePlayer players = 9;
  repeated SceneItem items = 10;
  repeated SceneResourceNode resource_nodes = 11;
  repeated SceneGroundLoot ground_loots = 12;
  repeated SceneHazard hazards = 13;
  repeated string related_codex_entry_ids = 14;
  string room_type = 15;
  string risk_level = 16;
  string landmark = 17;
  repeated string rumors = 18;
  bool pvp_enabled = 19;
}

message PlayerSnapshot {
  string account = 1;
  string character_name = 2;
  int32 level = 3;
  int32 hp = 4;
  int32 max_hp = 5;
  int32 attack_power = 6;
  int32 defense_power = 7;
  int64 spirit_stone = 8;
  string title = 9;
  string location_scene_id = 10;
  repeated InventoryItem inventory = 11;
  repeated QuestSummary quests = 12;
  CultivationState cultivation = 13;
  SectState sect = 14;
  repeated string known_commands = 15;
  int32 recommended_poll_interval_ms = 16;
  TeamState team = 17;
  string progression_chapter = 18;
  repeated string unlocked_regions = 19;
  int64 sect_contribution = 20;
  RaceState race = 21;
  BaseAttributeState base_attributes = 22;
  StatusAttributeState status_attributes = 23;
  CombatAttributeState combat_attributes = 24;
  repeated SkillSummary skills = 25;
  repeated SpellSummary spells = 26;
  repeated RecipeSummary recipes = 27;
  ProfessionState profession = 28;
  repeated CodexSummary codex_summaries = 29;
  StatusAttributeState current_status_attributes = 30;
  BackgroundState background = 31;
  repeated CommandDefinition command_catalog = 32;
  repeated string titles = 33;
}

message GameEvent {
  uint64 event_id = 1;
  string type = 2;
  string title = 3;
  string content = 4;
  int64 server_time_ms = 5;
  bool unread = 6;
}

message CommandResult {
  string command = 1;
  bool success = 2;
  string title = 3;
  string summary = 4;
  repeated string hints = 5;
  int32 recommended_poll_interval_ms = 6;
  repeated CodexSummary unlocked_codex_entries = 7;
  string spell_summary = 8;
  string brew_summary = 9;
  string hazard_feedback = 10;
}

message BootstrapRequest {
  string account = 1;
}

message BootstrapResponse {
  int32 code = 1;
  string message = 2;
  string trace_id = 3;
  int64 server_time_ms = 4;
  bool need_create_character = 5;
  PlayerSnapshot player = 6;
  SceneSnapshot scene = 7;
  repeated GameEvent events = 8;
  uint64 next_event_id = 9;
  repeated RaceState available_origins = 10;
  repeated BackgroundState available_backgrounds = 11;
}

message CharacterCreateRequest {
  string account = 1;
  string character_name = 2;
  string origin_id = 3;
  string background_id = 4;
}

message CharacterCreateResponse {
  int32 code = 1;
  string message = 2;
  string trace_id = 3;
  int64 server_time_ms = 4;
  PlayerSnapshot player = 5;
  SceneSnapshot scene = 6;
  repeated GameEvent events = 7;
  uint64 next_event_id = 8;
}

message CommandExecuteRequest {
  string account = 1;
  string command = 2;
}

message CommandExecuteResponse {
  int32 code = 1;
  string message = 2;
  string trace_id = 3;
  int64 server_time_ms = 4;
  CommandResult result = 5;
  PlayerSnapshot player = 6;
  SceneSnapshot scene = 7;
  repeated GameEvent events = 8;
  uint64 next_event_id = 9;
}

message FeedPullRequest {
  string account = 1;
  uint64 after_event_id = 2;
  int32 limit = 3;
}

message FeedPullResponse {
  int32 code = 1;
  string message = 2;
  string trace_id = 3;
  int64 server_time_ms = 4;
  repeated GameEvent events = 5;
  uint64 next_event_id = 6;
  int32 recommended_poll_interval_ms = 7;
  SceneSnapshot scene = 8;
}

message CodexListRequest {
  string account = 1;
  string category = 2;
}

message CodexListResponse {
  int32 code = 1;
  string message = 2;
  string trace_id = 3;
  int64 server_time_ms = 4;
  repeated CodexSummary entries = 5;
}

message CodexDetailRequest {
  string account = 1;
  string entry_id = 2;
}

message CodexDetailResponse {
  int32 code = 1;
  string message = 2;
  string trace_id = 3;
  int64 server_time_ms = 4;
  CodexEntry entry = 5;
}

message RankEntry {
  int32 rank = 1;
  string account = 2;
  string character_name = 3;
  string realm_name = 4;
  int32 level = 5;
  int64 exp = 6;
  int64 spirit_stone = 7;
  string sect_name = 8;
  string title = 9;
  int64 score = 10;
  string extra = 11;
}

message RankListRequest {
  string account = 1;
  string leaderboard = 2;
  int32 limit = 3;
}

message RankListResponse {
  int32 code = 1;
  string message = 2;
  string trace_id = 3;
  int64 server_time_ms = 4;
  string leaderboard = 5;
  repeated RankEntry entries = 6;
}
