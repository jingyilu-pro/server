server:
  manager:
    host: 127.0.0.1
    port: 18080
  login:
    host: 127.0.0.1
    port: 18081
  game:
    host: 127.0.0.1
    port: 18082

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  key_prefix: svc
  ttl_sec: 15
  refresh_sec: 5
  op_timeout_ms: 2000
  coro_workers: 1

mysql:
  host: 127.0.0.1
  port: 3306
  user: game_app
  # 推荐用环境变量 GAME_MYSQL_PASSWORD 覆盖，不在仓库保存真实密码
  password: ""
  database: game
  connect_timeout_ms: 2000
  coro_workers: 1

jwt:
  issuer: game-login
  # 推荐用环境变量 GAME_JWT_SECRET 覆盖，不在仓库保存真实密钥
  secret: ""
  expire_sec: 7200

client_pressure:
  enabled: false
  target:
    discovery_role: manager
    # manager_host: 127.0.0.1
    # manager_port: 18080
  scenario:
    # full_chain | manager_only | login_only | game_only
    scenario: full_chain
    warmup_sec: 0
    duration_sec: 30
    virtual_users: 20
    target_rps: 120
    ramp_up_sec: 5
    timeout_ms: 2000
    account_pool_size: 20
    auto_relogin: true
    login_account_pool:
      - user_0001
      - user_0002
      - user_0003
      - user_0004
  report:
    interval_sec: 5
    output: log
    output_dir: reports/pressure
    prefix: client_pressure
    json_path: reports/pressure/client_pressure.json
  http:
    coro_workers: 1
