server:
  manager:
    host: 127.0.0.1
    # 在 WSL 开发环境中实际监听所有网卡，方便 Windows 侧 Vite proxy 访问
    bind_host: 0.0.0.0
    # manager 使用固定端口，作为统一入口
    port: 18080
  login:
    host: 127.0.0.1
    # 对外仍通告 127.0.0.1，但监听放开到 WSL 网卡
    bind_host: 0.0.0.0
    # H5 直连反向代理时建议固定端口
    port: 18081
  game:
    host: 127.0.0.1
    # 对外仍通告 127.0.0.1，但监听放开到 WSL 网卡
    bind_host: 0.0.0.0
    # H5 直连反向代理时建议固定端口
    port: 18082

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  key_prefix: svc
  ttl_sec: 15
  refresh_sec: 5
  op_timeout_ms: 2000
  coro_workers: 1
  # 账号缓存 TTL（秒）
  account_cache_ttl_sec: 300

mysql:
  host: 127.0.0.1
  port: 3306
  user: game_app
  # 建议用环境变量 GAME_MYSQL_PASSWORD 覆盖，不在仓库保存真实密码
  password: ""
  database: game
  connect_timeout_ms: 2000
  coro_workers: 1

jwt:
  issuer: game-login
  # 建议用环境变量 GAME_JWT_SECRET 覆盖，不在仓库保存真实密钥
  secret: ""
  expire_sec: 7200

client_pressure:
  enabled: false
  target:
    discovery_role: manager
    # manager_host: 127.0.0.1
    # manager_port: 18080
  scenario:
    # full_chain | manager_only | login_only | game_only
    scenario: full_chain
    warmup_sec: 0
    duration_sec: 30
    virtual_users: 20
    target_rps: 120
    ramp_up_sec: 5
    timeout_ms: 2000
    account_pool_size: 20
    auto_relogin: true
    login_account_pool:
      - user_0001
      - user_0002
      - user_0003
      - user_0004
  guard:
    enabled: true
    min_samples: 100
    min_success_rate: 0.995
    max_timeout_rate: 0.005
    max_p95_ms: 150
    max_p99_ms: 300
  report:
    interval_sec: 5
    output: log
    output_dir: reports/pressure
    prefix: client_pressure
    json_path: reports/pressure/client_pressure.json
  http:
    coro_workers: 1
